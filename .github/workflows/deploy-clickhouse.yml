name: deploy/clickhouse image gate

on:
  pull_request:
    paths:
      - "deploy/clickhouse/**"
      - ".github/workflows/deploy-clickhouse.yml"
  push:
    branches: [main]
    paths:
      - "deploy/clickhouse/**"

jobs:
  verify:
    name: build image and run verify-local.sh
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install golang-migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar -xz -C /tmp migrate
          sudo install /tmp/migrate /usr/local/bin/migrate
          migrate -version
      - name: Run the gate
        run: deploy/clickhouse/verify-local.sh
